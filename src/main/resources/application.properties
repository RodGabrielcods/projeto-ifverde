spring.application.name=ifverde
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:ifverde}?useSSL=false&serverTimezone=America/Sao_Paulospring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:1234}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update